<style>
  :root {
    /* Novara Colour Tokens */
    --violet:          #4B1F78;   /* Primary */
    --crimson:         #D1213B;   /* Accent */
    --plum:            #22102F;   /* Ink / Dark */
    --blush:           #F7EEF3;   /* Light Canvas */

    --violet-lightest: #E9E4EF;
    --violet-light:    #C9BCD6;
    --violet-mid:      #9C84B5;
    --violet-dark:     #3D1A5E;

    --crimson-light:   #F1BCC4;
    --crimson-dark:    #941B37;

    /* Novara Typography System */
    --font-heading: 'Epilogue', system-ui, -apple-system, sans-serif;
    --font-body:    'Instrument Sans', system-ui, -apple-system, sans-serif;

    /* Light Theme (Default) */
    --bg:           var(--blush);
    --surface:      rgba(255, 255, 255, 0.88);
    --card-bg:      rgba(233, 228, 239, 0.8);
    --ink:          var(--plum);
    --accent:       var(--crimson);
    --accent-hover: var(--crimson-dark);
    --mute:         #6B5778;
    --sand:         rgba(201, 188, 214, 0.5);
    --border:       rgba(75, 31, 120, 0.14);

    --radius-sm:    8px;
    --radius-md:    14px;
    --radius-lg:    22px;
    --radius-full:  9999px;

    --shadow-sm:    0 2px 8px rgba(34, 16, 47, 0.08);
    --shadow-md:    0 8px 24px rgba(34, 16, 47, 0.14);
    --shadow-lg:    0 16px 36px rgba(34, 16, 47, 0.22);
    --transition:   all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Dark Theme */
  :root[data-theme="dark"] {
    --violet:       var(--blush);
    --bg:           var(--plum);
    --surface:      rgba(46, 24, 64, 0.78);
    --card-bg:      rgba(57, 31, 82, 0.82);
    --ink:          var(--blush);
    --accent:       var(--crimson);
    --accent-hover: #E68593;
    --mute:         var(--violet-light);
    --sand:         rgba(57, 31, 82, 0.7);
    --border:       rgba(247, 238, 243, 0.16);
    --shadow-sm:    0 2px 8px rgba(0, 0, 0, 0.35);
    --shadow-md:    0 8px 24px rgba(0, 0, 0, 0.5);
    --shadow-lg:    0 16px 36px rgba(0, 0, 0, 0.65);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --violet:       var(--blush);
      --bg:           var(--plum);
      --surface:      rgba(46, 24, 64, 0.78);
      --card-bg:      rgba(57, 31, 82, 0.82);
      --ink:          var(--blush);
      --accent:       var(--crimson);
      --accent-hover: #E68593;
      --mute:         var(--violet-light);
      --sand:         rgba(57, 31, 82, 0.7);
      --border:       rgba(247, 238, 243, 0.16);
      --shadow-sm:    0 2px 8px rgba(0, 0, 0, 0.35);
      --shadow-md:    0 8px 24px rgba(0, 0, 0, 0.5);
      --shadow-lg:    0 16px 36px rgba(0, 0, 0, 0.65);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }

  body {
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  /* Responsive Wallpaper Backdrop */
  .bg-wallpaper {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .bg-wallpaper-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
    transform: scale(1.02);
  }
  .bg-wallpaper::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 25%, rgba(247, 238, 243, 0.76) 0%, rgba(247, 238, 243, 0.88) 100%);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    transition: background 0.3s ease;
  }
  :root[data-theme="dark"] .bg-wallpaper::after {
    background: radial-gradient(circle at 50% 30%, rgba(34, 16, 47, 0.68) 0%, rgba(34, 16, 47, 0.88) 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .bg-wallpaper::after {
      background: radial-gradient(circle at 50% 30%, rgba(34, 16, 47, 0.68) 0%, rgba(34, 16, 47, 0.88) 100%);
    }
  }

  .wrap {
    width: 100%;
    max-width: 480px;
    text-align: center;
    position: relative;
    z-index: 1;
    padding-top: 12px;
  }

  /* Profile Header */
  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    margin: 36px auto 14px;
    background: linear-gradient(135deg, var(--violet), var(--crimson));
    display: grid;
    place-items: center;
    font-family: var(--font-heading);
    font-size: 36px;
    font-weight: 800;
    color: #FFFFFF;
    border: 3px solid var(--surface);
    overflow: hidden;
    box-shadow: var(--shadow-md);
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  h1 {
    font-family: var(--font-heading);
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 1.15;
    color: var(--violet);
  }
  :root[data-theme="dark"] h1,
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) h1 {
      color: var(--blush);
    }
  }

  .portfolio-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 12px auto 16px;
    padding: 7px 18px;
    border-radius: var(--radius-full);
    background: var(--violet);
    color: #FFFFFF;
    font-family: var(--font-body);
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
    letter-spacing: 0.01em;
    box-shadow: 0 4px 14px rgba(75, 31, 120, 0.22);
    transition: var(--transition);
  }
  .portfolio-pill:hover {
    background: var(--crimson);
    color: #FFFFFF;
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(209, 33, 59, 0.35);
  }
  .portfolio-pill .pill-arrow {
    font-size: 14px;
    transition: transform 0.2s ease;
  }
  .portfolio-pill:hover .pill-arrow {
    transform: translateX(3px);
  }
  :root[data-theme="dark"] .portfolio-pill {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--blush);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="dark"] .portfolio-pill:hover {
    background: var(--crimson);
    border-color: var(--crimson);
    color: #FFFFFF;
  }

  .services-tag {
    font-family: var(--font-body);
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--crimson);
    margin: 0 auto 6px;
    line-height: 1.4;
  }
  :root[data-theme="dark"] .services-tag {
    color: #E68593;
  }

  .bio {
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 400;
    line-height: 1.5;
    color: var(--mute);
    margin: 0 auto 24px;
    max-width: 380px;
  }

  /* Links List */
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
  }

  .link {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 60px;
    padding: 12px 18px;
    border-radius: var(--radius-md);
    background: var(--surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    color: var(--ink);
    text-decoration: none;
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
    animation: rise 0.5s ease both;
  }
  .link:hover {
    background: var(--surface);
    transform: translateY(-2px);
    border-color: rgba(75, 31, 120, 0.3);
    box-shadow: var(--shadow-md);
  }
  :root[data-theme="dark"] .link:hover {
    border-color: rgba(247, 238, 243, 0.28);
  }
  .link:active { transform: scale(0.98); }

  .link .icon {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    display: grid;
    place-items: center;
    flex-shrink: 0;
    color: #FFFFFF;
  }
  .link .icon svg {
    width: 20px;
    height: 20px;
    display: block;
    fill: currentColor;
  }
  .link .icon img { width: 20px; height: 20px; }

  .link .label {
    flex: 1;
    text-align: left;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 16px;
    letter-spacing: normal;
  }

  .link .arrow {
    color: var(--mute);
    font-size: 16px;
    transition: transform 0.2s ease, color 0.2s ease;
  }
  .link:hover .arrow {
    transform: translateX(3px);
    color: var(--accent);
  }

  footer {
    margin-top: 36px;
    color: var(--mute);
    font-size: 13px;
    font-family: var(--font-body);
  }

  /* Toast Notification */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 20px);
    background: var(--violet);
    color: #FFFFFF;
    padding: 10px 22px;
    border-radius: var(--radius-full);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    box-shadow: var(--shadow-md);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

  av.textContent = "";
  const i = new Image();
  i.src = profile.photo;
  i.alt = profile.name;
  av.appendChild(i);
} else {
  av.textContent = profile.initials;
}

// 2. Render Main Links Cards
const linksContainer = document.getElementById("links");
linksContainer.innerHTML = links.map((l, i) =>
  `<a class="link" href="${l.url}" ${l.copy ? `data-copy="${l.copy}"` : ''} target="_blank" rel="noopener noreferrer" style="animation-delay:${i * 50}ms">
     <span class="icon" style="background:${l.color}">${icons[l.icon] || ''}</span>
     <span class="label">${l.label}</span>
     <span class="arrow" aria-hidden="true">&rarr;</span>
   </a>`
).join("");

// Interactive click handling for items with copy payload (e.g. Discord handle)
linksContainer.querySelectorAll('.link[data-copy]').forEach(el => {
  el.addEventListener('click', async (e) => {
    const handle = el.getAttribute('data-copy');
    try {
      await navigator.clipboard.writeText(handle);
      showToast(`Discord handle copied: ${handle}`);
    } catch (err) {
      showToast(`Discord: ${handle}`);
    }
  });
});

// Toast notification
const toast = document.getElementById("toast");
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2000);
}

// Automatic theme sync with system
if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
  document.documentElement.setAttribute("data-theme", "dark");
}
</script>
</body>
</html>
